# Imaginary Angel Configuration File
# /etc/imaginary-angel.conf

# ============================================================================
# AUTO-FIX SETTINGS
# ============================================================================

# Enable automatic fixes for detected issues
# When enabled, the tool will automatically attempt to repair problems
# Options: true, false
AUTO_FIX=false

# ============================================================================
# MONITORING THRESHOLDS
# ============================================================================

# CPU usage alert threshold (percentage)
# Alert when CPU usage exceeds this value
# Range: 1-100
ALERT_THRESHOLD_CPU=80

# Memory usage alert threshold (percentage)
# Alert when memory usage exceeds this value
# Range: 1-100
ALERT_THRESHOLD_MEM=85

# Disk usage alert threshold (percentage)
# Alert when disk usage exceeds this value
# Range: 1-100
ALERT_THRESHOLD_DISK=90

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

# Enable suspicious process checking
# Monitors for processes running from temporary directories
# Options: true, false
SUSPICIOUS_PROCESS_CHECK=true

# Enable network anomaly detection
# Monitors for unusual network connections and patterns
# Options: true, false
NETWORK_ANOMALY_DETECTION=true

# ============================================================================
# HARDENING SETTINGS
# Used by /usr/share/imaginary-angel/hardening/harden.sh, which the installer
# runs on new systems and angel runs to apply or update hardening.
# Values passed as environment variables take precedence over these.
# ============================================================================

# Enable UFW (deny incoming, allow outgoing; SSH allowed only if sshd is enabled)
# Leaves an already active firewalld or UFW setup untouched
# Options: true, false
HARDEN_FIREWALL=true

# Install and enable AppArmor, adding the lsm= kernel parameter to the bootloader
# Options: true, false
HARDEN_APPARMOR=true

# Disable core dumps (they can leak passwords and keys from memory)
# Options: true, false
HARDEN_COREDUMPS=true

# Harden sshd with a drop-in (no root login, no empty passwords)
# Options: true, false
HARDEN_SSH=true

# Only members of the wheel group can use su
# Options: true, false
HARDEN_SU_WHEEL=true

# Stricter settings that can get in the way on desktops:
# ptrace limited to root (breaks gdb/strace attach), umask 027, DNSSEC=yes,
# logging of martian packets
# Options: true, false
HARDEN_STRICT=false

# Block loading kernel modules after boot (servers only: breaks USB devices,
# VPNs and anything else that loads a module on demand)
# Options: true, false
HARDEN_LOCK_MODULES=false

# ============================================================================
# LOG MANAGEMENT
# ============================================================================

# Number of days to retain logs
# Logs older than this will be cleaned up
# Range: 1-365
LOG_RETENTION_DAYS=30

# ============================================================================
# REPORTING SETTINGS
# ============================================================================

# Report output directory
# Where system reports will be saved
REPORT_DIR="/var/log/imaginary-angel"

# Cache directory
# Where temporary data is stored
CACHE_DIR="/var/cache/imaginary-angel"
